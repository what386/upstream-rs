name: Registry trust audit

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Audit published checksum coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/registry/audit_trust.py --output registry-trust-audit.md

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: registry-trust-audit
          path: registry-trust-audit.md
          if-no-files-found: error
