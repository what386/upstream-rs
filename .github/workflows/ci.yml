name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Zig
        if: matrix.os == 'ubuntu-latest'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Install Nushell for completion tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -fsSL https://github.com/nushell/nushell/releases/download/0.117.0/nu-0.117.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nu-0.117.0-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Run Python integration tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m unittest discover -s tests/integration -p 'test_*.py'
